project:
  type: website
  output-dir: _site
  resources:
    - charts/
    - assets/
    - data/
    - figures/
    - chat_images/

execute:
  enabled: false

website:
  title: "RVL-CDIP Document Classifier"
  description: "16-class document intelligence on RVL-CDIP — OpenRouter vision models, 27 prompt versions, Braintrust evals, and Monte Carlo analysis."
  favicon: assets/img/favicon.svg
  search:
    location: navbar
    type: overlay
    limit: 50
    copy-button: false
    show-item-context: true
    keyboard-shortcut:
      - f
      - /
      - s
  navbar:
    background: dark
    left:
      - text: Overview
        menu:
          - href: index.qmd
            text: Overview
          - href: manuscript.qmd
            text: Manuscript
      - text: Methods & Reference
        menu:
          - methods/overview.qmd
          - methods/document-processor.qmd
          - methods/cli-commands.qmd
          - methods/classes.qmd
          - methods/prompt-rules-provenance.qmd
      - text: Results
        menu:
          - results/headline-results.qmd
          - results/experiment-log.qmd
          - results/experiment-reports.qmd
          - results/confusion-matrices.qmd
          - results/gemini-800-notes.qmd
          - results/gemini-160-notes.qmd
      - text: Prompt Evolution
        menu:
          - prompts/prompt-changelog.qmd
          - prompts/enhancements.qmd
      - text: Cost Analysis
        menu:
          - cost/cost-estimation.qmd
          - cost/cost-projections.qmd
      - text: Research Memos
        menu:
          - memos/accuracy-arc.qmd
          - memos/generalization-falloff.qmd
          - memos/model-comparison.qmd
          - memos/cost-per-image.qmd
          - memos/hardest-classes.qmd
          - memos/ensemble-voting.qmd
          - memos/confidence-routing.qmd
          - memos/hasty-stop-words.qmd
          - memos/failure-pipeline.qmd
          - memos/exemplar-mining.qmd
      - text: Interactive
        menu:
          - interactive/cost-calculator.qmd
          - interactive/experiment-explorer.qmd
          - interactive/tides-game.qmd
      - text: Chat Examples
        href: chats.qmd
      - text: Monte Carlo
        menu:
          - montecarlo/overview.qmd
          - montecarlo/prompt-ablation.qmd
          - montecarlo/ensemble-voting.qmd
          - montecarlo/routing-abstention.qmd
          - montecarlo/failure-pipeline.qmd
          - montecarlo/exemplar-mining.qmd
          - montecarlo/ale-stopword.qmd
          - montecarlo/trace-language.qmd
