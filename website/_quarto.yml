format:
  html:
    theme:
      - cosmo
      - assets/css/custom.scss
    include-in-header:
      - assets/html/theme-head.html
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "On this page"
    toc-actions:
      - github: https://github.com/Exios66/AMFAM_capstone
      - issues: https://github.com/Exios66/AMFAM_capstone/issues/new
    number-sections: true
    smooth-scroll: true
    anchor-sections: true
    code-copy: true
    code-overflow: scroll
    code-tools: true
    link-external-icon: true
    link-external-newwindow: true
    mathjax: tex-chtml-full
